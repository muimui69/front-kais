<mat-sidenav-container class="h-screen w-full" autosize>

  <mat-sidenav
    #snav
    [mode]="mobileQuery.matches ?  'over' : 'side'"
    [fixedInViewport]="mobileQuery.matches"
    fixedTopGap="0"
    [opened]="! mobileQuery.matches"
    class="custom-sidenav">

    <!-- Header Limpio -->
    <div class="sidebar-header">
      <div class="logo-container">
             <img src="/assets/img/logo.png" alt="Logo" width="120" height="120" class="block">
      </div>
    </div>

    <!-- Navegación -->
    <nav class="sidebar-nav">
      @for (nav of fillerNav; track nav) {

        @if (! nav.items || nav.items. length === 0) {
          <a
            [routerLink]="nav.router"
            class="nav-item"
            [class.active]="isActive(nav.router)"
            matRipple>
            <mat-icon class="nav-icon">{{nav. icon}}</mat-icon>
            <span class="nav-label">{{nav.name}}</span>
          </a>
        }

        @if (nav. items && nav.items.length > 0) {
          <mat-expansion-panel class="nav-expansion">
            <mat-expansion-panel-header class="expansion-header">
              <mat-panel-title class="expansion-title">
                <mat-icon class="nav-icon">{{nav.icon}}</mat-icon>
                <span class="nav-label">{{nav.name}}</span>
              </mat-panel-title>
            </mat-expansion-panel-header>

            <div class="expansion-content">
              @for (item of nav.items; track item) {
                <a
                  [routerLink]="item.router"
                  class="nav-item nav-subitem"
                  [class. active]="isActive(item. router)"
                  matRipple>
                  <mat-icon class="nav-icon">{{item.icon}}</mat-icon>
                  <span class="nav-label">{{item.name}}</span>
                </a>
              }
            </div>
          </mat-expansion-panel>
        }
      }
    </nav>

  </mat-sidenav>


  <mat-sidenav-content class="main-content">

    <!-- Toolbar Minimalista -->
    <header class="app-toolbar">
      <div class="toolbar-left">
        <button mat-icon-button (click)="snav.toggle()" class="menu-btn">
          <mat-icon>menu</mat-icon>
        </button>
       </div>

      <div class="toolbar-right">
        <button mat-icon-button class="toolbar-btn">
          <mat-icon>notifications_none</mat-icon>
          <span class="notification-dot"></span>
        </button>
        <shared-user-avatar-menu />
      </div>
    </header>

    <!-- Contenido -->
    <main class="page-content">
      <router-outlet></router-outlet>
    </main>

  </mat-sidenav-content>
</mat-sidenav-container>
