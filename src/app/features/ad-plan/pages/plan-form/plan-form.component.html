<div class="min-h-screen bg-gray-50 pb-20 pt-8 px-4 sm:px-6 lg:px-8">
  <div class="max-w-3xl mx-auto">

    <div class="flex items-center justify-between mb-8">
      <div class="flex items-center gap-2">
        <button mat-icon-button routerLink="/ad-plans" class="text-gray-500">
          <mat-icon>arrow_back</mat-icon>
        </button>
        <h1 class="text-2xl font-bold text-gray-900 m-0">{{ pageTitle }}</h1>
      </div>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8">
      <form [formGroup]="form" (ngSubmit)="save()" class="space-y-6">

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1 ml-1">Nombre del Plan</label>
          <mat-form-field appearance="outline" class="w-full">
            <input matInput formControlName="name" placeholder="Ej: Plan Mensual Básico">
            <mat-icon matSuffix>label</mat-icon>
            <mat-error *ngIf="form.get('name')?.hasError('minlength')">Mínimo 3 caracteres</mat-error>
            <mat-error *ngIf="form.get('name')?.hasError('required')">Requerido</mat-error>
          </mat-form-field>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1 ml-1">Duración (Días)</label>
            <mat-form-field appearance="outline" class="w-full">
              <input matInput type="number" formControlName="durationInDays" min="1">
              <mat-icon matSuffix>date_range</mat-icon>
              <mat-error>Requerido (mínimo 1)</mat-error>
            </mat-form-field>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1 ml-1">Precio </label>
            <mat-form-field appearance="outline" class="w-full">
              <input matInput type="number" formControlName="price" min="0">
              <span matPrefix class="mr-2 text-gray-500">$</span>
              <mat-error>No puede ser negativo</mat-error>
            </mat-form-field>
          </div>
        </div>

        <div class="bg-gray-50 p-4 rounded-lg flex justify-between items-center">
          <div>
            <p class="font-medium text-gray-900">Estado del Plan</p>
            <p class="text-xs text-gray-500">Si está inactivo, no aparecerá para la venta.</p>
          </div>
          <mat-slide-toggle formControlName="isActive" color="primary">
            {{ form.get('isActive')?.value ? 'Activo' : 'Inactivo' }}
          </mat-slide-toggle>
        </div>

        <div class="flex justify-end gap-3 pt-4 border-t border-gray-100">
          <button type="button" routerLink="/ad-plans" mat-button>Cancelar</button>
          <button type="submit" mat-flat-button color="primary" [disabled]="form.invalid || isLoading" class="!py-6">
            <mat-spinner diameter="20" *ngIf="isLoading" class="mr-2 inline-block"></mat-spinner>
            Guardar
          </button>
        </div>

      </form>
    </div>

  </div>
</div>
