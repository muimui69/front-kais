<form [formGroup]="loginForm" (ngSubmit)="onLogin()"
  class="min-h-screen flex justify-center items-center ">
  <div
    class="flex flex-col items-center w-full max-w-md ">
    <img class="mb-4" src="logo-kais.webp" alt width="100" height="100">

    <mat-form-field appearance="fill" class="w-full mb-4">
      <mat-label>Nombre del usuario</mat-label>
      <input matInput placeholder="Ex. Admin01" formControlName="username">
      <mat-icon matSuffix>person</mat-icon>
      <mat-error>Este campo es obligatorio</mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill" class="w-full mb-4">
      <mat-label>Contraseña</mat-label>
      <input matInput [type]="hide() ? 'password' : 'text'"
        placeholder="Ex. Abc123" formControlName="pass">
      <button type="button" mat-icon-button matSuffix
        (click)="clickEvent($event)" [attr.aria-label]="'Hide password'"
        [attr.aria-pressed]="hide()">
        <mat-icon>{{hide() ? 'visibility_off' : 'visibility'}}</mat-icon>
      </button>
      <mat-error>Este campo es obligatorio</mat-error>
    </mat-form-field>

    <button type="submit" class="w-full mt-2" mat-raised-button
      [disabled]="loginForm.invalid || isLoading" color="primary">
      <mat-icon>login</mat-icon>Ingresar
    </button>

    @if(isLoading){
    <div class="pt-5">
      <mat-spinner
        diameter="50"></mat-spinner>
    </div>
    }
  </div>
</form>
