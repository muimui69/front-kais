<mat-icon class="large-icon" color="primary">question_mark</mat-icon>
<h2 mat-dialog-title>{{title}}</h2>
<mat-dialog-content>
  <div class="d-flex justify-content-center">
    {{message}}
  </div>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-flat-button mat-dialog-close>Cancelar</button>
  <button mat-raised-button [mat-dialog-close]="true" cdkFocusInitial>Si</button>
</mat-dialog-actions>
